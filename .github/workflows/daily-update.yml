# 存放位置：repo 根目錄的 .github/workflows/daily-update.yml
#
# 設定步驟（Kevina 需要自己做一次）：
# 1. GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#    新增以下 4 個 secrets：
#      TAIPEITHEATER_USER, TAIPEITHEATER_PASS
#      INTERNAL_REPORT_USER, INTERNAL_REPORT_PASS
#      ANTHROPIC_API_KEY   （在 console.anthropic.com 申請的 API key，不是 Claude.ai 的登入密碼）
# 2. GitHub repo -> Settings -> Actions -> General -> Workflow permissions
#    選「Read and write permissions」，這樣 Action 才能用內建 GITHUB_TOKEN 直接 push，不需要另外的 PAT
# 3. 把這個檔案放到 .github/workflows/daily-update.yml，
#    把 scripts/ 整個資料夾放到 repo 根目錄
# 4. 先手動觸發一次（Actions 分頁 -> daily-update -> Run workflow）確認會不會成功，
#    第一次大機率會在登入那步失敗（見 scripts/scrape.py 檔頭說明），照錯誤訊息回報給我調整即可

name: Daily Box Office Update

on:
  schedule:
    # 台北時間每天早上 09:30（UTC+8），對應 UTC 01:30
    - cron: "30 1 * * *"
  workflow_dispatch: {}  # 允許手動觸發，方便測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update script
        env:
          TAIPEITHEATER_USER: ${{ secrets.TAIPEITHEATER_USER }}
          TAIPEITHEATER_PASS: ${{ secrets.TAIPEITHEATER_PASS }}
          INTERNAL_REPORT_USER: ${{ secrets.INTERNAL_REPORT_USER }}
          INTERNAL_REPORT_PASS: ${{ secrets.INTERNAL_REPORT_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/main.py

      - name: Commit and push if changed
        run: |
          git config user.name "showtimes-daily-bot"
          git config user.email "actions@github.com"
          git add index.html 儀表板.html 秀泰影城每日營運儀表板.html 秀泰影城每日營運儀表板_github.html
          git diff --cached --quiet && echo "沒有變更，略過 commit" || git commit -m "自動更新每日營運數據 $(date -u +%Y-%m-%d)"
          git push
